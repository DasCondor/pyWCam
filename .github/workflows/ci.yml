name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          PYWCAM_VIDEO_GID=44 docker compose -f compose.yaml -f compose.usb.yaml config --quiet
          PYWCAM_SOURCE=rtsp://192.0.2.1/test docker compose -f compose.yaml -f compose.rtsp.yaml config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml config --quiet
      - name: Build and run demo container
        env:
          PYWCAM_PASSWORD: ci-test-password-only
        run: |
          docker compose up -d --build
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors -u viewer:$PYWCAM_PASSWORD http://127.0.0.1:8080/healthz
          curl --fail -u viewer:$PYWCAM_PASSWORD http://127.0.0.1:8080/snapshot.jpg -o /tmp/pywcam.jpg
          test -s /tmp/pywcam.jpg
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          docker compose exec -T pywcam python /app/docker-healthcheck.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python demo/build.py
      - run: git diff --exit-code -- docs/demo/index.html
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_sandbox.py
