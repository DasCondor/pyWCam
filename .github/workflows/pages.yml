name: Sandbox demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['demo/**', 'docs/demo/**', 'templates/index.html', 'static/app.css', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python demo/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo
      - uses: actions/deploy-pages@v4
        id: deployment
