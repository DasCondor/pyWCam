<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · pyWCam</title><link rel="stylesheet" href="/static/app.css"><script src="/static/theme.js" defer></script><script src="/static/login.js" defer></script></head><body><header class="topbar"><h1>pyWCam <small>2.0</small></h1><label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header><main class="login-panel"><h2>Sign in</h2><p>Enter your account password and six-digit authenticator code.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="128"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="512"><label for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><p id="loginError" role="alert"></p><button>Sign in</button></form></main></body></html>
